<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive portrait experiment designed to follow mouse movement on desktop and device tilt on supported mobile browsers. Artwork assets must be supplied for the effect to render.">
  <meta property="og:title" content="Joker Eye Tracker">
  <meta property="og:description" content="Interactive portrait experiment for mouse and device-orientation input. Requires valid local artwork assets.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://powder-ranger.github.io/joker-eye-tracker/">
  <link rel="canonical" href="https://powder-ranger.github.io/joker-eye-tracker/">
  <title>Joker Eye Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; touch-action: none;
    }
    #stage {
      position: relative;
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      background: #0a0a0a;
    }
    #canvas {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      display: block;
    }
    #hint {
      position: absolute;
      bottom: 20px; left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      z-index: 20;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }
    #status {
      position: absolute;
      top: 16px; left: 0; right: 0;
      text-align: center;
      color: #ff6b6b;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      z-index: 30;
      display: none;
      max-width: 620px;
      margin: 0 auto;
      padding: 18px 22px;
      line-height: 1.6;
      background: rgba(0,0,0,0.88);
      border: 1px solid rgba(255,107,107,0.6);
      left: 16px;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="hint">Tilt your device or move the mouse • Tap once for motion permission</div>
    <div id="status"></div>
  </div>

  <script>
    // ============================================================
    // CONFIG – easy to tweak
    // ============================================================
    const MAX_OFFSET_X = 18;
    const MAX_OFFSET_Y = 12;
    const SENSITIVITY  = 1.2;
    const SMOOTHING    = 0.16;

    // Approximate pupil centers in the original 1024×1024 artwork
    const LEFT_EYE  = { x: 420, y: 378 };
    const RIGHT_EYE = { x: 604, y: 378 };
    const PUPIL_RADIUS = 19;

    // ============================================================
    // State
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    const status = document.getElementById('status');

    let img = new Image();
    let imgLoaded = false;
    let currentX = 0, currentY = 0;
    let targetX = 0, targetY = 0;
    let hasOrientation = false;
    let scale = 1;

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    // Try several filenames so it works as soon as you upload the image
    const candidates = [
      'joker.png',
      'joker-base.png',
      'joker-original.jpg',
      '1000015595.jpg'
    ];

    function tryLoad(index) {
      if (index >= candidates.length) {
        status.style.display = 'block';
        status.innerHTML = 'ARTWORK REQUIRED<br><br>The interactive stage cannot render until valid artwork is added to this repository. The current joker-original.jpg file is a text placeholder, not an image.<br><br>Expected asset: <b>joker.png</b> or <b>joker-base.png</b> in the repository root.<br><br><a href="https://github.com/POWDER-RANGER/joker-eye-tracker#setup-the-image-layers" style="color:#ff8a8a;pointer-events:auto">VIEW ASSET SETUP INSTRUCTIONS</a>';
        return;
      }
      img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        imgLoaded = true;
        status.style.display = 'none';
        resize();
        requestAnimationFrame(loop);
      };
      img.onerror = () => tryLoad(index + 1);
      img.src = candidates[index] + '?t=' + Date.now();
    }
    tryLoad(0);

    function resize() {
      if (!imgLoaded) return;
      const maxW = window.innerWidth;
      const maxH = window.innerHeight;
      const ratio = Math.min(maxW / img.width, maxH / img.height);
      scale = ratio;
      canvas.width  = Math.round(img.width  * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.style.width  = canvas.width  + 'px';
      canvas.style.height = canvas.height + 'px';
    }
    window.addEventListener('resize', resize);

    function loop() {
      if (!imgLoaded) return;

      currentX += (targetX - currentX) * SMOOTHING;
      currentY += (targetY - currentY) * SMOOTHING;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const dx = currentX * scale;
      const dy = currentY * scale;
      const r  = PUPIL_RADIUS * scale;

      function drawPupil(cx, cy) {
        const x = cx * scale + dx;
        const y = cy * scale + dy;

        // Soft edge
        ctx.beginPath();
        ctx.arc(x, y, r + 1.5 * scale, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fill();

        // Main pupil
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = '#0a0a0a';
        ctx.fill();

        // Highlight
        ctx.beginPath();
        ctx.arc(x - r * 0.28, y - r * 0.28, r * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fill();
      }

      drawPupil(LEFT_EYE.x, LEFT_EYE.y);
      drawPupil(RIGHT_EYE.x, RIGHT_EYE.y);

      requestAnimationFrame(loop);
    }

    function handleMouse(e) {
      if (hasOrientation) return;
      const rect = canvas.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top  + rect.height / 2;
      const normX = (e.clientX - cx) / (rect.width  / 2);
      const normY = (e.clientY - cy) / (rect.height / 2);
      targetX = clamp(normX * MAX_OFFSET_X * SENSITIVITY, -MAX_OFFSET_X, MAX_OFFSET_X);
      targetY = clamp(normY * MAX_OFFSET_Y * SENSITIVITY, -MAX_OFFSET_Y, MAX_OFFSET_Y);
    }
    window.addEventListener('mousemove', handleMouse, { passive: true });

    function handleOrientation(e) {
      hasOrientation = true;
      const gamma = e.gamma || 0;
      const beta  = e.beta  || 0;
      const normX = clamp(gamma / 25, -1, 1);
      const normY = clamp((beta - 45) / 30, -1, 1);
      targetX = clamp(normX * MAX_OFFSET_X * SENSITIVITY, -MAX_OFFSET_X, MAX_OFFSET_X);
      targetY = clamp(normY * MAX_OFFSET_Y * SENSITIVITY, -MAX_OFFSET_Y, MAX_OFFSET_Y);
    }

    async function requestOrientationPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const p = await DeviceOrientationEvent.requestPermission();
          if (p === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          }
        } catch (err) {
          console.warn(err);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    function initOnInteraction() {
      requestOrientationPermission();
      window.removeEventListener('click', initOnInteraction);
      window.removeEventListener('touchstart', initOnInteraction);
    }
    window.addEventListener('click', initOnInteraction, { once: true });
    window.addEventListener('touchstart', initOnInteraction, { once: true });
    requestOrientationPermission();

    setTimeout(() => { hint.style.opacity = '0'; }, 5500);

    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  </script>
</body>
</html>
