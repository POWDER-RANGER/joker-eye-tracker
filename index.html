<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Joker Eye Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    .layer {
      position: absolute;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    #base {
      z-index: 1;
    }

    #eyes {
      z-index: 2;
      will-change: transform;
      transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* Loading / instruction overlay that fades */
    #hint {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      z-index: 20;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="base" class="layer" src="joker-base.png" alt="">
    <img id="eyes" class="layer" src="joker-eyes.png" alt="">
    <div id="hint">Tilt your device or move the mouse • Tap once for motion permission</div>
  </div>

  <script>
    // ============================================================
    // CONFIG – tweak these values to taste
    // ============================================================
    const MAX_OFFSET_X = 14;   // max horizontal pixels the eyes can travel
    const MAX_OFFSET_Y = 10;   // max vertical pixels
    const SENSITIVITY  = 1.15; // overall multiplier
    const SMOOTHING    = 0.18; // 0 = instant, 1 = very slow (lerp factor)

    // ============================================================
    // State
    // ============================================================
    const eyes = document.getElementById('eyes');
    const hint = document.getElementById('hint');
    let currentX = 0;
    let currentY = 0;
    let targetX  = 0;
    let targetY  = 0;
    let hasOrientation = false;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function animate() {
      currentX += (targetX - currentX) * SMOOTHING;
      currentY += (targetY - currentY) * SMOOTHING;
      eyes.style.transform = `translate3d(${currentX.toFixed(2)}px, ${currentY.toFixed(2)}px, 0)`;
      requestAnimationFrame(animate);
    }
    animate();

    // Fade the hint after a few seconds
    setTimeout(() => { hint.style.opacity = '0'; }, 6000);

    // Mouse fallback (desktop)
    function handleMouse(e) {
      if (hasOrientation) return;
      const rect = document.getElementById('stage').getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top  + rect.height / 2;
      const normX = (e.clientX - centerX) / (rect.width  / 2);
      const normY = (e.clientY - centerY) / (rect.height / 2);
      targetX = clamp(normX * MAX_OFFSET_X * SENSITIVITY, -MAX_OFFSET_X, MAX_OFFSET_X);
      targetY = clamp(normY * MAX_OFFSET_Y * SENSITIVITY, -MAX_OFFSET_Y, MAX_OFFSET_Y);
    }
    window.addEventListener('mousemove', handleMouse, { passive: true });

    // Device Orientation
    function handleOrientation(e) {
      hasOrientation = true;
      const gamma = e.gamma || 0;
      const beta  = e.beta  || 0;
      const normX = clamp(gamma / 25, -1, 1);
      const normY = clamp((beta - 45) / 30, -1, 1);
      targetX = clamp(normX * MAX_OFFSET_X * SENSITIVITY, -MAX_OFFSET_X, MAX_OFFSET_X);
      targetY = clamp(normY * MAX_OFFSET_Y * SENSITIVITY, -MAX_OFFSET_Y, MAX_OFFSET_Y);
    }

    async function requestOrientationPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          }
        } catch (err) {
          console.warn('Orientation permission denied or unavailable', err);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    function initOnInteraction() {
      requestOrientationPermission();
      window.removeEventListener('click', initOnInteraction);
      window.removeEventListener('touchstart', initOnInteraction);
    }

    window.addEventListener('click', initOnInteraction, { once: true });
    window.addEventListener('touchstart', initOnInteraction, { once: true });
    requestOrientationPermission();

    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  </script>
</body>
</html>
